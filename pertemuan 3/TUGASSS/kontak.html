<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kirim Resep - Kontak Kami</title>
</head>
<body>
    <header>
        <h1>Bagikan Resepmu</h1>
        <nav>
            <a href="index.html">Beranda</a> | 
            <a href="resep.html">Resep Ayam</a> | 
            <a href="kontak.html">Kirim Resep</a>
        </nav>
    </header>

    <main>
        <h2>Formulir Kontribusi Resep</h2>
        <p>Punya resep modifikasi Richeese lainnya? Kirimkan di sini!</p>
        
        <form action="thanks.html" method="get">
            <label for="nama">Nama Lengkap:</label><br>
            <input type="text" id="nama" name="nama" required placeholder="Contoh: aa rama"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="nama_resep">Nama Resep:</label><br>
            <input type="text" id="nama_resep" name="nama_resep"><br><br>

            <label for="isi_resep">Tulis Resep & Cara Masak:</label><br>
            <textarea id="isi_resep" name="isi_resep" rows="10" cols="50"></textarea><br><br>

            <button type="submit">Kirim Sekarang</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Blog Resep Richeese KW - Tugas HTML</p>
    </footer>
</body>
</html>
