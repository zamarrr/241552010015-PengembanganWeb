<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyek 2 - Formulir Validasi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-container">
    <div class="form-header">
      <h2>Pendaftaran Akun</h2>
      <p>Silakan isi data Anda di bawah ini dengan benar.</p>
    </div>

    <form id='formulir'>
      <div class='field'>
        <label for="nama">Nama Lengkap</label>
        <input id='nama' type='text' placeholder='Minimal 3 karakter'>
        <span class='pesan-error'></span>
      </div>
      
      <div class='field'>
        <label for="email">Alamat Email</label>
        <input id='email' type='email' placeholder='contoh@surat.com'>
        <span class='pesan-error'></span>
      </div>
      
      <div class='field'>
        <label for="password">Password</label>
        <input id='password' type='password' placeholder='Minimal 8 karakter'>
        
        <div class='bilah'><div class='isian'></div></div>
        
        <div id="status-password" class="status-pass-text">Belum diisi</div>
        
        <span class='pesan-error'></span>
      </div>
      
      <button type='submit'>Daftar Sekarang</button>
    </form>
    
    <div id='sukses' class='tersembunyi'>
      <div class="ikon-sukses">✓</div>
      <h3>Pendaftaran Berhasil!</h3>
      <p>Mengalihkan Anda ke halaman dasbor...</p>
    </div>
  </div>

</body>
</html>
